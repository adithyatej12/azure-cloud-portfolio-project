name: Azure Static Web Apps CI/CD - Anshumaan Khare Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-AnshumaanKhare/package-lock.json

      - name: Install Dependencies
        run: |
          cd portfolio-AnshumaanKhare
          npm ci

      - name: Build Application
        run: |
          cd portfolio-AnshumaanKhare
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ANSHUMAAN }}
          action: upload
          app_location: "portfolio-AnshumaanKhare/dist"
          skip_app_build: true

